services:
  db:
    image: "postgres:16"
    container_name: coa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coa
      POSTGRES_PASSWORD: coa_password
      POSTGRES_DB: coa
    ports:
      - "5432:5432"
    volumes:
      - coa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coa -d coa"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  coa_pgdata: